[project]
name = "healthdoc-backend"
version = "0.1.0"
description = "FastAPI Backend for HealthDoc AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "python-multipart>=0.0.9",
    "langchain>=0.2.14",
    "langchain-google-genai>=1.0.8",
    "langchain-community>=0.2.12",
    "langchain-ollama>=0.2.0",
    "pypdf>=4.3.1",
    "faiss-cpu>=1.8.0.post1",
    "python-dotenv>=1.0.1",
    "ollama>=0.3.1",
    "Pillow>=10.4.0",
    "paddleocr>=2.8.1",
    "paddlepaddle>=2.6.1",
    "pdf2image>=1.17.0",
    "pypdfium2>=4.30.0",
]

[tool.uv]
package = false
